name: Bug Report
description: Report a bug or issue with the kernel
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > This repo builds **one** kernel: **OnePlus 13 on stock OxygenOS 16 (Android 16)**.
        > Reports from other devices, custom ROMs, or other OxygenOS versions will be closed — see [compatibility](../../compatibility.md).
        > Fill in **all required fields** — incomplete reports will be closed without investigation.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Confirm before submitting.
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: My device is a **OnePlus 13** running **stock OxygenOS 16**.
          required: true
        - label: I flashed a kernel built by **this** repo (not upstream WildKernels or another fork).
          required: true

  - type: input
    id: device
    attributes:
      label: Model Number
      description: Exact model number from Settings → About Phone.
      placeholder: "e.g. PHB110"
    validations:
      required: true

  - type: input
    id: oos_version
    attributes:
      label: OxygenOS Version
      description: Full firmware build number from Settings → About Phone.
      placeholder: "e.g. OxygenOS 16.0.0.400"
    validations:
      required: true

  - type: dropdown
    id: manager_type
    attributes:
      label: Manager Type
      description: Which root manager matches the ZIP you flashed (`KSUN` or `KSU` in the filename)?
      options:
        - KernelSU-Next (KSUN)
        - KernelSU (KSU)
    validations:
      required: true

  - type: input
    id: manager_version
    attributes:
      label: Manager Version
      description: Manager version shown in the manager app.
      placeholder: "e.g. v3.2.0 (33207)"
    validations:
      required: true

  - type: input
    id: driver_version
    attributes:
      label: Kernel Driver Version
      description: Driver version shown in the manager app (under GKI2).
      placeholder: "e.g. 33207"
    validations:
      required: true

  - type: input
    id: zip_name
    attributes:
      label: Flashed ZIP Filename
      description: The exact AnyKernel3 ZIP you flashed — it encodes the kernel, KSU and SUSFS versions.
      placeholder: "e.g. AK3-NIKITOS4683-OP13_A16_android15-6.6.30_KSUN_33207_SuSFS_v2.2.0.zip"
    validations:
      required: true

  - type: dropdown
    id: kernel_source
    attributes:
      label: Kernel Installation Source
      options:
        - GitHub Release
        - GitHub Actions artifact
    validations:
      required: true

  - type: input
    id: kernel_link
    attributes:
      label: Release Tag or Actions Run Link
      description: |
        - **Release**: paste the tag (e.g. `v2.2.0-r1`) or the full release URL.
        - **Artifact**: paste the full URL of the Actions run (e.g. `https://github.com/.../actions/runs/XXXXXXXXX`).
      placeholder: "e.g. v2.2.0-r1 or https://github.com/.../actions/runs/..."
    validations:
      required: true

  - type: input
    id: uname
    attributes:
      label: Kernel Version (`uname -r`)
      description: Run `adb shell uname -r`, or read it in the manager app.
      placeholder: "e.g. 6.6.30-android15-nikitos4683"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the issue.
      placeholder: "Describe what is happening..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to consistently reproduce the bug.
      placeholder: |
        1. Flash kernel zip via ...
        2. Open manager ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Regression?
      description: Was this working on a previous kernel version?
      options:
        - "Yes — worked on a previous version"
        - "No — never worked"
        - "Unknown / first install"
    validations:
      required: true

  - type: input
    id: last_working
    attributes:
      label: "(Regression only) Last working kernel version"
      description: Only if you selected "Yes" for Regression. Which release tag or ZIP was the last one without this issue?
      placeholder: "e.g. v2.2.0-r1"

  - type: dropdown
    id: stock_boot
    attributes:
      label: Boot.img stock
      description: Working on stock boot.img?
      options:
        - "Untested"
        - "Yes"
        - "No"
    validations:
      required: true

  - type: textarea
    id: manager_log
    attributes:
      label: Manager Log (name_log.tar.gz)
      description: |
        Export logs from the manager: **Settings → Export logs** → a `name_log.tar.gz` file will be generated.
        Attach it here by dragging and dropping the file into this field, or click the attachment icon below the text box.
      placeholder: "Drag and drop name_log.tar.gz here, or click the attachment icon below..."
    validations:
      required: true

  - type: textarea
    id: kmsg
    attributes:
      label: SYSTEM_LAST_KMSG
      description: |
        Attach the file `/data/persist_log/backup/SYSTEM_LAST_KMSG.txt` by dragging and dropping it into this field, or click the attachment icon below the text box.
        Also include the **file modification date** (visible in file properties or via `ls -la /data/persist_log/backup/SYSTEM_LAST_KMSG.txt`).
      placeholder: |
        File date: YYYY-MM-DD HH:MM

        Drag and drop SYSTEM_LAST_KMSG.txt here, or click the attachment icon below...

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information (installed modules, previous kernel, `adb logcat`, screenshots, etc.).
